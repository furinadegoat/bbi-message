<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>He Vuong Platform</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'JetBrains Mono',monospace;
  background:#05080f;
  color:#00ffcc;
  overflow-x:hidden;
}
canvas{position:fixed;inset:0;z-index:0}
.app{position:relative;z-index:2;max-width:1000px;margin:auto;padding:80px 20px}

h1{text-align:center;font-size:52px;margin-bottom:10px}
.subtitle{text-align:center;opacity:.6;margin-bottom:50px}

nav{
  display:flex;justify-content:center;gap:20px;
  margin-bottom:50px;flex-wrap:wrap;
}
nav button{
  background:none;border:1px solid rgba(0,255,204,.4);
  color:#00ffcc;padding:8px 14px;border-radius:6px;
  cursor:pointer;
}
nav button:hover{background:rgba(0,255,204,.1)}

section{
  display:none;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(0,255,204,.25);
  border-radius:12px;
  padding:30px;
}
section.active{display:block}

.card{
  border-left:3px solid rgba(0,255,204,.5);
  padding-left:16px;margin:10px 0;
}

input,textarea{
  width:100%;background:#000;border:1px solid #00ffcc;
  color:#00ffcc;padding:8px;font-family:inherit;
}
textarea{resize:vertical}

footer{text-align:center;margin-top:60px;opacity:.5}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="app">

<h1>LAM AN BINH</h1>
<p class="subtitle">personal cyber platform · system online</p>

<nav>
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('quotes')">Quotes</button>
<button onclick="show('board')">Message Board</button>
<button onclick="show('playground')">Playground</button>
<button onclick="show('secret')">Secret</button>
</nav>

<section id="dashboard" class="active">
<h2>🧠 SYSTEM DASHBOARD</h2>
<div class="card" id="sysinfo"></div>
</section>

<section id="quotes">
<h2>💭 QUOTE ENGINE</h2>
<div class="card" id="quoteBox"></div>
<button onclick="newQuote()">New Quote</button>
</section>

<section id="board">
<h2>💬 MESSAGE BOARD</h2>
<textarea id="msg" placeholder="Leave a message..."></textarea>
<button onclick="postMsg()">Post</button>
<div id="messages"></div>
</section>

<section id="playground">
<h2>🕹 LOGIC PLAYGROUND</h2>
<p>Click to generate random array and sort it.</p>
<button onclick="gen()">Generate</button>
<button onclick="sortArr()">Sort</button>
<div class="card" id="arrayView"></div>
</section>

<section id="secret">
<h2>🔐 SECRET ZONE</h2>
<div class="card" id="secretBox">Locked.</div>
</section>

<footer>© 2026 · He Vuong Platform</footer>

</div>

<script>
/* MATRIX */
const c=document.getElementById("matrix"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();addEventListener("resize",resize);
const chars="01",size=14;
let cols=Math.floor(c.width/size),drops=Array(cols).fill(1);
(function loop(){
  ctx.fillStyle="rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#00ffcc";
  ctx.font=size+"px monospace";
  for(let i=0;i<drops.length;i++){
    ctx.fillText(chars[Math.random()*2|0],i*size,drops[i]*size);
    if(drops[i]*size>c.height&&Math.random()>0.975)drops[i]=0;
    drops[i]++;
  }
  requestAnimationFrame(loop);
})();

/* NAV */
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* USER SYSTEM */
if(!localStorage.uid){
  localStorage.uid="USER_"+Math.random().toString(16).slice(2,6).toUpperCase();
  localStorage.visits=1;
}else localStorage.visits++;

const boot=Date.now();
setInterval(()=>{
  sysinfo.innerText=
`id: ${localStorage.uid}
visits: ${localStorage.visits}
uptime: ${((Date.now()-boot)/1000)|0}s`;
},1000);

/* QUOTES */
const quotes=[
"encrypted mind · free soul",
"tri thức không bao giờ phản bội",
"sự im lặng là một dạng quyền lực"
];
function newQuote(){
  quoteBox.innerText=quotes[Math.random()*quotes.length|0];
}
newQuote();

/* MESSAGE BOARD */
const msgs=JSON.parse(localStorage.msgs||"[]");
function renderMsg(){
  messages.innerHTML=msgs.map(m=>`<div class="card">${m}</div>`).join("");
}
function postMsg(){
  if(msg.value.trim()){
    msgs.unshift(msg.value.trim());
    localStorage.msgs=JSON.stringify(msgs.slice(0,20));
    msg.value="";renderMsg();
  }
}
renderMsg();

/* PLAYGROUND */
let arr=[];
function gen(){
  arr=Array.from({length:8},()=>Math.floor(Math.random()*100));
  arrayView.innerText=arr.join(" ");
}
function sortArr(){
  arr.sort((a,b)=>a-b);
  arrayView.innerText=arr.join(" ");
}

/* SECRET */
let clicks=0;
document.addEventListener("keydown",e=>{
  if(e.key==="h") clicks++;
  if(clicks>=5){
    secretBox.innerText="ROOT ACCESS GRANTED.";
  }
});
</script>

</body>
</html>
