<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>He Vuong System</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'JetBrains Mono',monospace;
  background:#05080f;
  color:#00ffcc;
  overflow-x:hidden;
}
canvas{position:fixed;inset:0;z-index:0}
.content{position:relative;z-index:2;max-width:900px;margin:auto;padding:80px 20px}

h1{text-align:center;font-size:54px;margin-bottom:10px}
.subtitle{text-align:center;opacity:.6;margin-bottom:60px}

section{
  background:rgba(0,0,0,.65);
  border:1px solid rgba(0,255,204,.25);
  border-radius:12px;
  padding:26px;
  margin-bottom:36px;
  opacity:0;
  transform:translateY(30px);
  transition:.6s ease;
}
section.show{opacity:1;transform:none}

.decor{text-align:center;opacity:.35;margin:40px 0}

footer{text-align:center;opacity:.5;margin-top:60px;font-size:13px}

/* TERMINAL */
#terminal{
  position:fixed;
  inset:0;
  background:rgba(5,8,15,.95);
  color:#00ffcc;
  display:none;
  z-index:5;
  padding:30px;
}
#term-output{
  height:80vh;
  overflow-y:auto;
  white-space:pre-wrap;
}
#term-input{
  width:100%;
  background:none;
  border:none;
  outline:none;
  color:#00ffcc;
  font-family:inherit;
}
.prompt{opacity:.6}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="content">

<h1>LAM AN BINH</h1>
<p class="subtitle">encrypted mind · free soul</p>

<section>
<h2>SYSTEM STATUS</h2>
<p id="status"></p>
</section>

<section>
<h2>IDENTITY</h2>
<p>
Học sinh Chuyên Tin HSGS<br>
HSGS Code Camp · Archimedes Site Lead
</p>
</section>

<section>
<h2>QUOTE</h2>
<p id="quote"></p>
</section>

<section>
<h2>CONTACT</h2>
<p>
Facebook: Lam Binh<br>
Instagram: @adunguoinhon<br>
Discord: adunguoinhon
</p>
</section>

<footer>© 2026 · system online</footer>
</div>

<!-- TERMINAL -->
<div id="terminal">
<div id="term-output"></div>
<div>
<span class="prompt">root@hevuong:~$ </span>
<input id="term-input" autocomplete="off">
</div>
</div>

<script>
/* MATRIX */
const c=document.getElementById("matrix");
const ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();addEventListener("resize",resize);
const chars="01",size=14;
let cols=Math.floor(c.width/size),drops=Array(cols).fill(1);
function matrix(){
  ctx.fillStyle="rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#00ffcc";
  ctx.font=size+"px monospace";
  for(let i=0;i<drops.length;i++){
    ctx.fillText(chars[Math.random()*2|0],i*size,drops[i]*size);
    if(drops[i]*size>c.height&&Math.random()>0.975)drops[i]=0;
    drops[i]++;
  }
  requestAnimationFrame(matrix);
}
matrix();

/* SCROLL REVEAL */
const obs=new IntersectionObserver(e=>{
  e.forEach(x=>x.isIntersecting&&x.target.classList.add("show"));
});
document.querySelectorAll("section").forEach(s=>obs.observe(s));

/* SYSTEM CORE */
const state={
  boot:Date.now(),
  interactions:+localStorage.interactions||0
};
document.addEventListener("click",()=>{
  state.interactions++;
  localStorage.interactions=state.interactions;
});
setInterval(()=>{
  const up=((Date.now()-state.boot)/1000)|0;
  status.textContent=
`uptime: ${up}s
interactions: ${state.interactions}
mode: ${(new Date().getHours()>22||new Date().getHours()<5)?"night":"active"}`;
},1000);

/* QUOTE ENGINE */
const quotes=[
"encrypted mind · free soul",
"người suy nghĩ nhiều thường im lặng",
"tri thức là thứ không ai cướp được"
];
quote.textContent=quotes[Math.random()*quotes.length|0];

/* TERMINAL */
const term=document.getElementById("terminal");
const out=document.getElementById("term-output");
const input=document.getElementById("term-input");

const commands={
help:()=>`help
whoami
projects
quote
contact
clear`,
whoami:()=>`Lam An Binh – HSGS Informatics`,
projects:()=>`HSGS Code Camp
Archimedes System`,
quote:()=>quotes[Math.random()*quotes.length|0],
contact:()=>`instagram: adunguoinhon`,
hevuong:()=>{
document.body.style.background="#120014";
return "ROOT ACCESS GRANTED";
},
clear:()=>{out.textContent="";return"";}
};

document.addEventListener("keydown",e=>{
  if(e.key==="~"){
    term.style.display="block";
    input.focus();
  }
  if(e.key==="Escape") term.style.display="none";
});

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const cmd=input.value.trim();
    out.textContent+=`\n$ ${cmd}\n${commands[cmd]?.()||"command not found"}\n`;
    input.value="";
    out.scrollTop=out.scrollHeight;
  }
});

/* MEMORY */
if(!localStorage.visited){
  localStorage.visited=1;
  alert("INITIALIZING NEW USER");
}else{
  console.log("WELCOME BACK");
}
</script>

</body>
</html>
